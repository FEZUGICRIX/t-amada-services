services:
  postgres:
    image: postgres:16-alpine
    container_name: t-travel-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - travel-network

  flight-service:
    build:
      context: .
      dockerfile: apps/flight-service/Dockerfile
    container_name: t-travel-flight-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: flight-service
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/flight_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-network

  hotel-service:
    build:
      context: .
      dockerfile: apps/hotel-service/Dockerfile
    container_name: t-travel-hotel-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: hotel-service
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/hotel_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-network

  insurance-service:
    build:
      context: .
      dockerfile: apps/insurance-service/Dockerfile
    container_name: t-travel-insurance-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_NAME: insurance-service
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/insurance_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-network

  transfer-service:
    build:
      context: .
      dockerfile: apps/transfer-service/Dockerfile
    container_name: t-travel-transfer-service
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      SERVICE_NAME: transfer-service
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/transfer_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-network

volumes:
  postgres_data:
    name: t-travel-postgres-data

networks:
  travel-network:
    name: travel-network
    driver: bridge
